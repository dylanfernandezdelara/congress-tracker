[package]
name = "daily_senate_update"
version = "0.1.0"
edition = "2024"
description = "Legacy Rust CLI used as a validation/oracle for the Cloudflare Worker output"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Environment
dotenvy = "0.15"

# HTTP Client
reqwest = { version = "0.12", features = ["json"] }

# XML Parsing
quick-xml = { version = "0.37", features = ["serialize"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Output formatting
comfy-table = "7.1"

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Error handling
anyhow = "1.0"

[features]
# Keep the default build focused on the Senate XML validation path.
default = []
# Legacy Congress.gov client (not used by the Worker ingestion pipeline).
congress-api = []

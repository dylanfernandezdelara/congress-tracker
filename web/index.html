<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NY Senators Voting Record</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: #333;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }

    h1 {
      color: #1a1a1a;
      margin-bottom: 10px;
      font-size: 2em;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 0.95em;
    }

    .header-info {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 6px;
      font-size: 0.9em;
    }

    .header-info span {
      color: #666;
    }

    .header-info strong {
      color: #1a1a1a;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .error {
      background: #fee;
      border: 1px solid #fcc;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 20px;
      color: #c33;
    }

    .senators-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .senator-card {
      background: #f9f9f9;
      border-radius: 6px;
      padding: 20px;
      border-left: 4px solid #0066cc;
    }

    .senator-card h2 {
      font-size: 1.3em;
      margin-bottom: 10px;
      color: #1a1a1a;
    }

    .senator-card .party {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 15px;
    }

    .vote-stats {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .vote-stat {
      text-align: center;
    }

    .vote-stat .count {
      font-size: 1.5em;
      font-weight: bold;
      color: #0066cc;
    }

    .vote-stat .label {
      font-size: 0.85em;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .votes-section {
      margin-top: 40px;
    }

    .votes-section h2 {
      font-size: 1.5em;
      margin-bottom: 20px;
      color: #1a1a1a;
    }

    .vote-item {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 20px;
      background: white;
    }

    .vote-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .vote-number {
      font-weight: bold;
      color: #0066cc;
      font-size: 1.1em;
    }

    .vote-result {
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: 600;
      text-transform: uppercase;
    }

    .vote-result.passed {
      background: #d4edda;
      color: #155724;
    }

    .vote-result.failed {
      background: #f8d7da;
      color: #721c24;
    }

    .vote-title {
      font-size: 1.1em;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1a1a1a;
    }

    .vote-question {
      color: #666;
      font-size: 0.95em;
      margin-bottom: 15px;
    }

    .vote-counts {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      font-size: 0.9em;
      color: #666;
    }

    .vote-counts span {
      padding: 4px 8px;
      background: #f0f0f0;
      border-radius: 4px;
    }

    .senators-votes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .senator-vote {
      padding: 12px;
      background: #f9f9f9;
      border-radius: 4px;
      border-left: 3px solid #ccc;
    }

    .senator-vote.yea {
      border-left-color: #28a745;
    }

    .senator-vote.nay {
      border-left-color: #dc3545;
    }

    .senator-vote.present {
      border-left-color: #ffc107;
    }

    .senator-vote.not-voting {
      border-left-color: #6c757d;
    }

    .senator-vote .name {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .senator-vote .vote {
      font-size: 0.9em;
      color: #666;
      text-transform: capitalize;
    }

    .config {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
      font-size: 0.85em;
      color: #666;
    }

    .config input {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9em;
      width: 100%;
      max-width: 500px;
      margin-top: 5px;
    }

    .config button {
      margin-top: 10px;
      padding: 8px 16px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
    }

    .config button:hover {
      background: #0052a3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>New York Senators Voting Record</h1>
    <div class="subtitle">Latest Senate roll-call votes for NY senators</div>

    <div id="loading" class="loading">Loading voting data...</div>
    <div id="error" class="error" style="display: none;"></div>

    <div id="content" style="display: none;">
      <div class="header-info">
        <div>
          <span>Vote Date:</span> <strong id="vote-date"></strong>
        </div>
        <div>
          <span>Last Updated:</span> <strong id="generated-at"></strong>
        </div>
        <div>
          <span>Congress:</span> <strong id="congress"></strong>
        </div>
        <div>
          <span>Session:</span> <strong id="session"></strong>
        </div>
      </div>

      <div id="senators-summary" class="senators-summary"></div>

      <div class="votes-section">
        <h2>Votes</h2>
        <div id="votes-list"></div>
      </div>
    </div>

    <div class="config">
      <label>
        Worker API URL:
        <input type="text" id="api-url" placeholder="https://senate-data-worker.your-subdomain.workers.dev">
      </label>
      <button onclick="updateApiUrl()">Update URL</button>
    </div>
  </div>

  <script>
    // Get API URL from localStorage or use default
    function getApiUrl() {
      const stored = localStorage.getItem('apiUrl');
      if (stored) return stored;
      // Default to localhost for development, user should update for production
      return 'http://localhost:8787';
    }

    function updateApiUrl() {
      const input = document.getElementById('api-url');
      const url = input.value.trim();
      if (url) {
        localStorage.setItem('apiUrl', url);
        loadData();
      } else {
        alert('Please enter a valid URL');
      }
    }

    // Initialize API URL input
    document.getElementById('api-url').value = getApiUrl();

    function formatDate(dateString) {
      if (!dateString) return 'N/A';
      try {
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', { 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric' 
        });
      } catch {
        return dateString;
      }
    }

    function formatDateTime(dateString) {
      if (!dateString) return 'N/A';
      try {
        const date = new Date(dateString);
        return date.toLocaleString('en-US', { 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit'
        });
      } catch {
        return dateString;
      }
    }

    function getVoteClass(vote) {
      const v = vote.toLowerCase();
      if (v === 'yea' || v === 'yes') return 'yea';
      if (v === 'nay' || v === 'no') return 'nay';
      if (v === 'present') return 'present';
      return 'not-voting';
    }

    function renderSenatorsSummary(senators) {
      const summaryDiv = document.getElementById('senators-summary');
      
      // Group votes by senator
      const senatorVotes = {};
      senators.forEach(senator => {
        if (!senatorVotes[senator.name]) {
          senatorVotes[senator.name] = {
            name: senator.name,
            party: senator.party,
            votes: { yea: 0, nay: 0, present: 0, notVoting: 0 }
          };
        }
        const vote = senator.vote_cast.toLowerCase();
        if (vote === 'yea' || vote === 'yes') senatorVotes[senator.name].votes.yea++;
        else if (vote === 'nay' || vote === 'no') senatorVotes[senator.name].votes.nay++;
        else if (vote === 'present') senatorVotes[senator.name].votes.present++;
        else senatorVotes[senator.name].votes.notVoting++;
      });

      summaryDiv.innerHTML = Object.values(senatorVotes).map(senator => `
        <div class="senator-card">
          <h2>${senator.name}</h2>
          <div class="party">${senator.party}</div>
          <div class="vote-stats">
            <div class="vote-stat">
              <div class="count">${senator.votes.yea}</div>
              <div class="label">Yea</div>
            </div>
            <div class="vote-stat">
              <div class="count">${senator.votes.nay}</div>
              <div class="label">Nay</div>
            </div>
            <div class="vote-stat">
              <div class="count">${senator.votes.present}</div>
              <div class="label">Present</div>
            </div>
            <div class="vote-stat">
              <div class="count">${senator.votes.notVoting}</div>
              <div class="label">Not Voting</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderVotes(votes) {
      const votesList = document.getElementById('votes-list');
      
      votesList.innerHTML = votes.map(vote => {
        const resultClass = vote.result.toLowerCase().includes('agreed') || 
                           vote.result.toLowerCase().includes('passed') ? 'passed' : 'failed';
        
        return `
          <div class="vote-item">
            <div class="vote-header">
              <div class="vote-number">Vote #${vote.vote_number}</div>
              <div class="vote-result ${resultClass}">${vote.result}</div>
            </div>
            <div class="vote-title">${vote.title || 'No title'}</div>
            ${vote.question ? `<div class="vote-question">${vote.question}</div>` : ''}
            <div class="vote-counts">
              <span>Yea: ${vote.counts.yeas}</span>
              <span>Nay: ${vote.counts.nays}</span>
              <span>Present: ${vote.counts.present}</span>
              <span>Absent: ${vote.counts.absent}</span>
            </div>
            <div class="senators-votes">
              ${vote.members.map(member => `
                <div class="senator-vote ${getVoteClass(member.vote_cast)}">
                  <div class="name">${member.name}</div>
                  <div class="vote">${member.vote_cast}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadData() {
      const apiUrl = getApiUrl();
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const content = document.getElementById('content');

      loading.style.display = 'block';
      error.style.display = 'none';
      content.style.display = 'none';

      try {
        // Fetch latest data
        const response = await fetch(`${apiUrl}/state/NY/latest.json`);
        
        if (!response.ok) {
          if (response.status === 404) {
            throw new Error('No voting data found. The Worker may not have run yet, or the R2 bucket is empty.');
          }
          throw new Error(`Failed to fetch data: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();

        // Update header info
        document.getElementById('vote-date').textContent = formatDate(data.vote_date);
        document.getElementById('generated-at').textContent = formatDateTime(data.generated_at);
        document.getElementById('congress').textContent = data.congress;
        document.getElementById('session').textContent = data.session;

        // Collect all senators from all votes
        const allSenators = [];
        data.votes.forEach(vote => {
          vote.members.forEach(member => {
            allSenators.push(member);
          });
        });

        // Render senators summary
        renderSenatorsSummary(allSenators);

        // Render votes
        renderVotes(data.votes);

        loading.style.display = 'none';
        content.style.display = 'block';

      } catch (err) {
        loading.style.display = 'none';
        error.style.display = 'block';
        error.textContent = `Error: ${err.message}`;
        console.error('Error loading data:', err);
      }
    }

    // Load data on page load
    loadData();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#fafafa" />
    <script>
      (function () {
        var stored = localStorage.getItem('theme')
        var theme
        if (stored === 'light' || stored === 'dark') {
          theme = stored
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark'
        } else {
          theme = 'light'
        }
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#fafafa')
      })()
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0a'/%3E%3Ccircle cx='22' cy='10' r='4' fill='%23292929'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Congress Tracker — plain-English passage votes from the House and Senate" />
    <title>Congress Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

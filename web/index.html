<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#fafafa" />
    <script>
      (function () {
        var stored = localStorage.getItem('theme')
        var theme
        if (stored === 'light' || stored === 'dark') {
          theme = stored
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark'
        } else {
          theme = 'light'
        }
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#fafafa')
      })()
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Track Congress — independent, unofficial plain-English passage votes from the House and Senate. Not a U.S. government website."
    />
    <title>Track Congress</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Preview-only API Worker config.
# Do not use this file for production deploys.

name = "daily-senate-update-api-dev"
main = "src/api-index.ts"
compatibility_date = "2025-12-10"

[limits]
cpu_ms = 300000

[vars]
CONGRESS = "119"
SESSION = "2"
TARGET_STATE = "ALL"
ALLOWED_ORIGIN = "*"
DATA_FRESHNESS_MAX_HOURS = "87600"
HARNESS_MODE = "fixture"
HARNESS_FIXTURE_SET = "canonical"
HARNESS_NOW = "2026-01-20T15:00:00Z"

[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "daily-senate-update-dev-data"

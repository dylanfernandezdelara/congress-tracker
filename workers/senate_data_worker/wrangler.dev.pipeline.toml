# Preview-only pipeline Worker config.
# Do not use this file for production deploys.

name = "congress-tracker-pipeline-dev"
main = "src/pipeline-index.ts"
compatibility_date = "2025-12-10"

[vars]
CONGRESS = "119"
SESSION = "2"
TARGET_STATE = "ALL"
# Do not set ALLOWED_ORIGIN = "*" on pipeline workers; use a specific origin if needed.
DATA_FRESHNESS_MAX_HOURS = "87600"
HARNESS_MODE = "fixture"
HARNESS_FIXTURE_SET = "canonical"
HARNESS_NOW = "2026-01-20T15:00:00Z"

[[d1_databases]]
binding = "SENATE_DB"
database_name = "senate-platform-local"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "00000000-0000-0000-0000-000000000000"

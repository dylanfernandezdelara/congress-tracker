name = "congress-tracker-api"
main = "src/worker.ts"
compatibility_date = "2025-12-10"

[triggers]
crons = ["0 10 * * *"]

[limits]
cpu_ms = 300000

[vars]
CONGRESS = "119"
SESSION = "2"
# Production: set to your deployed frontend origin (do not use "*" publicly).
# ALLOWED_ORIGIN = "https://your-site.example"

[[d1_databases]]
binding = "DB"
database_name = "congress-tracker"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "00000000-0000-0000-0000-000000000000"

[env.preview.vars]
CONGRESS = "119"
SESSION = "2"
ALLOWED_ORIGIN = "*"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "congress-tracker"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "00000000-0000-0000-0000-000000000000"

# SYNC REQUIRED — keep this file aligned with wrangler.toml at the repo root
# (name, compatibility_date, preview_urls, cron, vars, D1 binding/id/name must match).
# Paths here are worker-dir-relative; root wrangler.toml uses repo-relative paths for
# Cloudflare Workers Builds. npm scripts invoke this file via --config.
name = "congress-tracker-api"
main = "src/worker.ts"
compatibility_date = "2025-12-10"

# Generate per-version/per-branch preview URLs on workers.dev so a commit/PR
# can be opened in a browser without touching production traffic.
# (Top-level key: must appear before any [table] headers in TOML.)
preview_urls = true

# Serve the built React app (web/dist) from this same Worker.
# Static files are served directly; any non-asset path falls through to the
# Worker (API routes) and unknown navigations get the SPA shell (index.html).
[assets]
directory = "../../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[triggers]
crons = ["0 10 * * *", "*/15 * * * *"]

[limits]
cpu_ms = 300000

[vars]
CONGRESS = "119"
SESSION = "2"
# Production: set to your deployed frontend origin (do not use "*" publicly).
# ALLOWED_ORIGIN = "https://your-site.example"

[[d1_databases]]
binding = "DB"
database_name = "congress-tracker"
database_id = "e21fa2df-1c7d-4a83-8044-f28803c80a26"
preview_database_id = "e21fa2df-1c7d-4a83-8044-f28803c80a26"

# Note: previews are served via per-version "preview URLs" (see preview_urls
# above and .github/workflows/preview.yml), not a separate named environment.
# Preview versions reuse the bindings/secrets defined above, including this D1
# database, so treat preview traffic as having production data access.

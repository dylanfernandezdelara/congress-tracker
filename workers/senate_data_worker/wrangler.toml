# SYNC REQUIRED — keep this file aligned with wrangler.toml at the repo root
# (name, compatibility_date, preview_urls, cron, vars, D1 binding/id/name,
# browser binding must match). Browser bindings are NOT inherited by named envs.
# Paths here are worker-dir-relative; root wrangler.toml uses repo-relative paths for
# Cloudflare Workers Builds. npm scripts invoke this file via --config.
name = "congress-tracker-api"
main = "src/worker.ts"
# quickAction() on the browser binding requires >= 2026-03-24.
compatibility_date = "2026-03-24"
# Keep workers.dev enabled even with [[routes]] custom domains. Wrangler infers
# workers_dev=false when routes are present unless this is explicit — that broke
# ops automation (health + admin pipeline) behind Bot Fight on trackcongress.org.
# Top-level keys MUST appear before any [table] header in TOML.
workers_dev = true
# Generate per-version/per-branch preview URLs on workers.dev so a commit/PR
# can be opened in a browser without touching production traffic.
preview_urls = true

# Senate.gov blocks plain Worker fetch (Akamai 403). Browser Rendering reaches
# the LIS vote menu so daily cron can refresh without external ops scripts.
# remote=true so `wrangler dev` can exercise quickAction (unsupported fully local).
[browser]
binding = "BROWSER"
remote = true

# Serve the built React app (web/dist) from this same Worker.
# Static files are served directly; any non-asset path falls through to the
# Worker (API routes) and unknown navigations get the SPA shell (index.html).
[assets]
directory = "../../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[triggers]
crons = ["0 10 * * *", "20 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[limits]
cpu_ms = 300000

[vars]
CONGRESS = "119"
SESSION = "2"
# Production custom domains (do not use "*" publicly). Comma-separated allowlist.
ALLOWED_ORIGIN = "https://trackcongress.org,https://www.trackcongress.org"
# Zone for edge cache purge after pipeline writes (pair with CACHE_PURGE_TOKEN secret).
CF_ZONE_ID = "86b690387ae840600f5f3341aa154cce"

# Apex + www Custom Domains (Cloudflare manages DNS + certs on the zone).
[[routes]]
pattern = "trackcongress.org"
custom_domain = true

[[routes]]
pattern = "www.trackcongress.org"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "congress-tracker"
database_id = "e21fa2df-1c7d-4a83-8044-f28803c80a26"
preview_database_id = "da5dbbc1-8111-4aa9-a49e-5e03022e44cc"

# Deployed preview URLs (`wrangler versions upload --env preview`) bind the isolated
# preview D1 below. `preview_database_id` applies to local `wrangler dev` only.
# Clear routes so preview never inherits production custom domains.
[env.preview]
routes = []

[env.preview.browser]
binding = "BROWSER"
remote = true

[env.preview.vars]
CONGRESS = "119"
SESSION = "2"
ALLOWED_ORIGIN = "*"
# Do not inherit production zone — preview must never purge trackcongress.org.
CF_ZONE_ID = ""

[[env.preview.d1_databases]]
binding = "DB"
database_name = "congress-tracker-preview"
database_id = "da5dbbc1-8111-4aa9-a49e-5e03022e44cc"

# Note: previews are served via per-version "preview URLs" (see preview_urls
# above). Upload with `--env preview` so bindings use congress-tracker-preview.
# Pipeline writes are also blocked on preview hostnames in application code.

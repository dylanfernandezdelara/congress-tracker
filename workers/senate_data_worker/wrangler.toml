name = "senate-data-api-worker"
main = "src/api-index.ts"
compatibility_date = "2025-12-10"

[limits]
cpu_ms = 300000

[vars]
CONGRESS = "119"
SESSION = "2"
TARGET_STATE = "ALL"
# Production: set to your deployed frontend origin (do not use "*" publicly).
# ALLOWED_ORIGIN = "https://your-site.example"
# Optional: OpenRouter attribution headers.
# OPENROUTER_APP_REFERER = "https://your-site.example"
# OPENROUTER_APP_TITLE = "congress_tracker_worker"

[[d1_databases]]
binding = "SENATE_DB"
database_name = "senate-platform-local"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "00000000-0000-0000-0000-000000000000"

# Optional when the queue is created:
# [[queues.producers]]
# binding = "PIPELINE_QUEUE"
# queue = "senate-platform-jobs"

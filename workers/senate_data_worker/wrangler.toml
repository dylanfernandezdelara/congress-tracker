name = "senate-data-worker"
main = "src/index.ts"
compatibility_date = "2025-12-10"

[triggers]
crons = ["0 10 * * *"]

[limits]
cpu_ms = 300000

[vars]
CONGRESS = "119"
SESSION = "2"
TARGET_STATE = "ALL"
# Production: set to your deployed frontend origin (do not use "*" publicly).
# ALLOWED_ORIGIN = "https://your-site.example"
# Optional: OpenRouter attribution headers.
# OPENROUTER_APP_REFERER = "https://your-site.example"
# OPENROUTER_APP_TITLE = "daily_senate_update_worker"

[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "senate-data-bucket"

[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "senate_analytics"
database_id = "local-dev"

[[durable_objects.bindings]]
name = "INGEST_LOCK"
class_name = "IngestLock"

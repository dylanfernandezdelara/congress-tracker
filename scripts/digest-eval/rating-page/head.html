<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow reading column; a step rail on top; each bill is two steps (read one, then compare all). */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #17202b; --muted: #5b6676; --line: #dde2e9;
  --accent: #1f4fa8; --accent-soft: #e6edf9; --good: #1d7a46; --good-soft: #e3f3ea; --bad: #a8321f; --bad-soft: #f8e7e3;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141b; --surface: #171e28; --fg: #e6ebf2; --muted: #98a3b3; --line: #2a3442;
  --accent: #7da6f0; --accent-soft: #1c2a42; --good: #5cc48a; --good-soft: #15301f; --bad: #f08a76; --bad-soft: #3a1d17; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #171e28; --fg: #e6ebf2; --muted: #98a3b3; --line: #2a3442;
  --accent: #7da6f0; --accent-soft: #1c2a42; --good: #5cc48a; --good-soft: #15301f; --bad: #f08a76; --bad-soft: #3a1d17; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: grid; gap: 20px; }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.2rem; line-height: 1.3; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font: 500 .78rem var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rail { display: flex; gap: 6px; }
.rail span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.rail span.on { background: var(--accent); }
.bill { display: grid; gap: 4px; }
.billno { font: 500 .85rem var(--mono); color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 10px; min-width: 0; }
.card h3 { margin: 0; font-size: 1.08rem; line-height: 1.35; text-wrap: balance; }
.card ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .82rem; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--fg); }
.label { font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.sec { font: 500 .75rem var(--mono); color: var(--muted); }
.q { display: grid; gap: 10px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.grid { display: grid; gap: 14px; }
.pick { display: flex; gap: 8px; align-items: center; font-weight: 600; cursor: pointer; padding-top: 4px; border-top: 1px solid var(--line); }
.card:has(.pick input:checked) { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.tag { font: 500 .8rem var(--mono); color: var(--muted); }
.rankable { position: relative; cursor: pointer; }
.rankable:hover { border-color: var(--muted); }
.rankable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rankable.ranked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.rankno { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--bg, #fff); font: 600 .95rem var(--mono); display: grid; place-items: center; }
textarea { width: 100%; box-sizing: border-box; min-height: 70px; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
button { font: 600 1rem var(--body); padding: 10px 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg); cursor: pointer; }
button.ghost { background: transparent; color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, .opt:focus-within, .pick:focus-within, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: .88rem; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); }
.note.warn { background: var(--bad-soft); }
table { width: 100%; border-collapse: collapse; font-size: .92rem; font-variant-numeric: tabular-nums; }
td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ok { color: var(--good); font-weight: 600; } .no { color: var(--bad); font-weight: 600; }
.tablewrap { overflow-x: auto; }
@media (prefers-reduced-motion: no-preference) { .fade { animation: fade .18s ease-out; } @keyframes fade { from { opacity: .4 } to { opacity: 1 } } }
</style>
<div class="wrap" id="app">
  <div class="eyebrow">trackcongress · summary rating · __ROUND__</div>
  <h1>Which summary helps you understand the bill?</h1>
  <p class="muted">Loading…</p>
</div>

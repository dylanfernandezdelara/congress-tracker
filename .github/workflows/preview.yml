name: Preview Deploy

# Builds the web app, bundles it into the Worker, and uploads a *preview
# version* for every pull request. A preview version gets its own URL on
# workers.dev but does NOT receive production traffic, so opening a PR is safe.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account ID

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Upload Worker preview
    runs-on: ubuntu-latest
    # Skip pull requests from forks: they cannot access secrets, and running
    # untrusted code with credentials would be unsafe.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web app
        run: npm run build
        working-directory: web

      - name: Install worker dependencies
        run: npm ci
        working-directory: workers/senate_data_worker

      - name: Upload preview version
        id: upload
        working-directory: workers/senate_data_worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pass the branch name via env (never inline into the script) to avoid
          # shell injection from attacker-controlled branch names.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # workers.dev hostname labels are limited to 63 chars; the alias label
          # becomes "<alias>-congress-tracker-api", so keep the alias <= 42.
          ALIAS=$(printf '%s' "$HEAD_REF" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g; s/--*/-/g; s/^-//; s/-$//' \
            | cut -c1-42 \
            | sed 's/-$//')
          echo "Preview alias: $ALIAS"
          npx wrangler versions upload --preview-alias "$ALIAS" 2>&1 | tee upload.log
          COMMIT_URL=$(grep 'Version Preview URL:' upload.log | grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' | head -1)
          ALIAS_URL=$(grep 'Version Preview Alias URL:' upload.log | grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' | head -1)
          {
            echo "commit_url=$COMMIT_URL"
            echo "alias_url=$ALIAS_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Comment preview URLs on the PR
        uses: actions/github-script@v7
        env:
          COMMIT_URL: ${{ steps.upload.outputs.commit_url }}
          ALIAS_URL: ${{ steps.upload.outputs.alias_url }}
        with:
          script: |
            const marker = '<!-- cloudflare-preview -->';
            const { COMMIT_URL, ALIAS_URL } = process.env;
            const body = [
              marker,
              '### Cloudflare preview ready',
              '',
              `- Branch preview (stable): ${ALIAS_URL || '_unavailable_'}`,
              `- This commit: ${COMMIT_URL || '_unavailable_'}`,
              '',
              '_Preview versions do not receive production traffic. They reuse production bindings (including the D1 database)._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker dependencies
        run: npm ci
        working-directory: workers/senate_data_worker

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Run tests
        run: npm test

  public-readiness:
    name: Public Readiness Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run public readiness check
        run: npm run public:check

      - name: Setup Python
        if: github.event_name != 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install trufflehog
        if: github.event_name != 'pull_request'
        run: |
          python3 -m pip install --user trufflehog
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: History secret scan
        if: github.event_name != 'pull_request'
        run: npm run public:scan:history-secrets

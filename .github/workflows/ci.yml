name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    name: Worker Typecheck and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/senate_data_worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/senate_data_worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Run tests
        run: npm test

  web:
    name: Web Typecheck, Tests, and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm exec -- tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  harness:
    name: Deterministic Harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker dependencies
        run: npm ci
        working-directory: workers/senate_data_worker

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install Playwright browser
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: Run deterministic harness
        run: npm run harness:ci

      - name: Upload harness artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-artifacts
          path: target/harness
          if-no-files-found: ignore

  public-readiness:
    name: Public Readiness Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install trufflehog
        run: |
          python3 -m pip install --user trufflehog
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install worker dependencies
        run: npm ci
        working-directory: workers/senate_data_worker

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Run public readiness check
        run: npm run public:check

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    name: Worker Typecheck and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/senate_data_worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/senate_data_worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Run tests
        run: npm test

  web:
    name: Web Typecheck and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm exec -- tsc --noEmit

      - name: Run tests
        run: npm test

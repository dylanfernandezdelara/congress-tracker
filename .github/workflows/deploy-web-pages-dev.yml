name: Deploy web (Pages dev)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web-pages-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Upload Vite build to Cloudflare Pages
    runs-on: ubuntu-latest
    # Skip until repo secrets are configured (avoids failing main CI noise).
    if: ${{ vars.PAGES_DEV_DEPLOY_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy to Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run deploy:cloudflare:dev

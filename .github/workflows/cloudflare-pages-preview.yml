name: Cloudflare Pages Preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy Pages Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FORCE_E2E: "1"

      - name: Ensure Pages preview project exists
        run: |
          if ! npx wrangler pages project list | grep -q 'congress-tracker-dev'; then
            npx wrangler pages project create congress-tracker-dev --production-branch main
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: 0b001ef01845353691fdc2833d96b81d
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          DEPLOY_LOG="$(mktemp)"
          npx wrangler pages deploy dist \
            --project-name congress-tracker-dev \
            --branch "$BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$GITHUB_REF_NAME preview" \
            >"$DEPLOY_LOG" 2>&1
          cat "$DEPLOY_LOG"
          PREVIEW_URL="$(grep -m1 'Deployment alias URL' "$DEPLOY_LOG" | sed -E 's/.*(https:\/\/[^[:space:]]+).*/\1/' || true)"
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL="$(grep -m1 'Deployment complete' "$DEPLOY_LOG" | sed -E 's/.*(https:\/\/[^[:space:]]+).*/\1/' || true)"
          fi
          if [ -z "$PREVIEW_URL" ]; then
            echo "Could not parse preview URL from wrangler output" >&2
            exit 1
          fi
          echo "url=$PREVIEW_URL" >>"$GITHUB_OUTPUT"
          {
            echo "## Cloudflare Pages preview"
            echo ""
            echo "**URL:** $PREVIEW_URL"
            echo ""
            echo "Branch \`$BRANCH\` · commit \`${GITHUB_SHA::7}\`"
          } >>"$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_ACCOUNT_ID: 0b001ef01845353691fdc2833d96b81d
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cloudflare-pages-preview
          message: |
            ## Web preview (Cloudflare Pages)

            **Preview:** ${{ steps.deploy.outputs.url }}

            Deployed from `${{ github.head_ref }}` at `${{ github.event.pull_request.head.sha }}`.

            Uses fixture briefing data (`VITE_FORCE_E2E=1`), same as local `/?e2e=1`.

name: Cloudflare Pages Preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Deploy Pages Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FORCE_E2E: "1"

      - name: Ensure Pages preview project exists
        run: |
          if ! npx wrangler pages project list | grep -q 'congress-tracker-dev'; then
            npx wrangler pages project create congress-tracker-dev --production-branch main
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: 0b001ef01845353691fdc2833d96b81d
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy preview
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          npx wrangler pages deploy dist \
            --project-name congress-tracker-dev \
            --branch "$BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$GITHUB_REF_NAME preview"
        env:
          CLOUDFLARE_ACCOUNT_ID: 0b001ef01845353691fdc2833d96b81d
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

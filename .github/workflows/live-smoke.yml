name: Live Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5"

jobs:
  live-smoke:
    name: Scheduled Ingestion Live Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/senate_data_worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        id: secrets
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
        run: |
          if [[ -z "${CONGRESS_API_KEY}" || -z "${GOVINFO_API_KEY}" ]]; then
            echo "Missing required live-smoke secrets (CONGRESS_API_KEY and/or GOVINFO_API_KEY)."
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run_smoke=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.secrets.outputs.run_smoke == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/senate_data_worker/package-lock.json

      - name: Install dependencies
        if: steps.secrets.outputs.run_smoke == 'true'
        run: npm ci

      - name: Write .dev.vars
        if: steps.secrets.outputs.run_smoke == 'true'
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
        run: |
          cat > .dev.vars <<EOF
          CONGRESS_API_KEY=${CONGRESS_API_KEY}
          GOVINFO_API_KEY=${GOVINFO_API_KEY}
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          OPENROUTER_MODEL=${OPENROUTER_MODEL}
          EOF

      - name: Run live smoke
        if: steps.secrets.outputs.run_smoke == 'true'
        run: npm run smoke:scheduled

      - name: Report skipped smoke
        if: steps.secrets.outputs.run_smoke != 'true'
        run: echo "Skipping live smoke because required secrets are not configured."

      - name: Upload live smoke log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-log
          path: /tmp/wrangler-test-scheduled.log
          if-no-files-found: ignore

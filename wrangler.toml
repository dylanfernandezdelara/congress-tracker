# SYNC REQUIRED — keep this file aligned with workers/senate_data_worker/wrangler.toml
# (name, compatibility_date, preview_urls, cron, vars, D1 binding/id/name must match).
# Root paths are repo-relative for Cloudflare Workers Builds (`npx wrangler versions upload`
# from repo root). npm scripts use workers/senate_data_worker/wrangler.toml via --config.
name = "congress-tracker-api"
main = "workers/senate_data_worker/src/worker.ts"
compatibility_date = "2025-12-10"
preview_urls = true

[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[triggers]
crons = ["0 10 * * *", "20 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[limits]
cpu_ms = 300000

[vars]
CONGRESS = "119"
SESSION = "2"
# Production custom domains (do not use "*" publicly). Comma-separated allowlist.
ALLOWED_ORIGIN = "https://trackcongress.org,https://www.trackcongress.org"

[[routes]]
pattern = "trackcongress.org"
custom_domain = true

[[routes]]
pattern = "www.trackcongress.org"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "congress-tracker"
database_id = "e21fa2df-1c7d-4a83-8044-f28803c80a26"
preview_database_id = "da5dbbc1-8111-4aa9-a49e-5e03022e44cc"

# Deployed preview URLs (`wrangler versions upload --env preview`) bind the isolated
# preview D1 below. `preview_database_id` applies to local `wrangler dev` only.
# Clear routes so preview never inherits production custom domains.
[env.preview]
routes = []

[env.preview.vars]
CONGRESS = "119"
SESSION = "2"
ALLOWED_ORIGIN = "*"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "congress-tracker-preview"
database_id = "da5dbbc1-8111-4aa9-a49e-5e03022e44cc"
